<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="../shared/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../shared/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="../shared/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="../shared/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Contributions | Brian Crink</title>
</head>
<body>
<style>
  body {
    background: #000000;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px 80px;
    box-sizing: border-box;
    opacity: 0;
    animation: fadeIn 1.3s forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 900px;
    margin-top: 80px;
  }

  .body {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 900px;
  }

  .title-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 24px;
  }

  .name {
    font-size: 3rem;
    font-weight: 600;
    color: #ffffff;
    margin: 0;
    letter-spacing: -0.5px;
  }

  .name-link {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .name-link:hover {
    opacity: 0.85;
  }

  .version-badge {
    position: absolute;
    top: 8px;
    left: 100%;
    margin-left: 6px;
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    background-color: #374151;
    color: #d1d5db;
    font-size: 0.7rem;
    font-weight: 600;
    border-radius: 9999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    border: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .version-badge:hover {
    background-color: #4b5563;
    transform: translateY(-1px);
  }

  .dev-image {
    width: 100%;
    max-width: 420px;
    height: auto;
    margin: 10px 0 36px 0;
    opacity: 0.95;
  }

  .stats-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
    margin-bottom: 24px;
    transition: opacity 0.2s ease;
  }

  .stats-link:hover {
    opacity: 0.85;
  }

  .stats {
    font-size: 1.5rem;
    margin-bottom: 0;
  }

  .stats strong {
    color: #00ff9d;
  }

  .calendar-wrapper {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    max-width: 100%;
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .day-labels {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-top: 22px;
    font-size: 10px;
    color: #8b949e;
    text-align: right;
    min-width: 28px;
  }

  .day-labels span {
    height: 11px;
    line-height: 11px;
  }

  .graph-area {
    display: flex;
    flex-direction: column;
  }

  .month-labels {
    display: flex;
    gap: 3px;
    height: 18px;
    font-size: 10px;
    color: #8b949e;
    margin-bottom: 4px;
  }

  .month-labels span {
    display: inline-block;
    width: 11px;
    white-space: nowrap;
  }

  #calendar {
    display: flex;
    gap: 3px;
  }

  .week {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .day {
    width: 11px;
    height: 11px;
    border-radius: 2px;
    background: #0f131e;
    cursor: pointer;
  }

  .day.empty {
    background: transparent;
    cursor: default;
  }

  .day.level-1 { background: #0e4429; }
  .day.level-2 { background: #006d32; }
  .day.level-3 { background: #26a641; }
  .day.level-4 { background: #39d353; }

  #tooltip {
    position: fixed;
    background: rgba(22, 27, 34, 0.94);
    color: #e6edf3;
    font-size: 12px;
    line-height: 1.45;
    padding: 8px 12px;
    border-radius: 8px;
    white-space: pre-line;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s;
    z-index: 9999;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    min-width: 150px;
    transform: translate(-50%, -100%) scale(0.96);
  }

  #tooltip.visible {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -100%) scale(1);
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 0.8rem;
    color: #8b949e;
  }

  .legend .day {
    width: 10px;
    height: 10px;
  }

  a {
    color: #00ff9d;
    text-decoration: none;
  }

  .loading {
    color: #8b949e;
  }
</style>

  <div class="header">
    <div class="title-wrapper">
      <h1 class="name">
        <a href="https://briancrink.com" class="name-link">Brian Crink</a>
      </h1>
      <span class="version-badge" onclick="window.location.href='releases/#v1.0.0'">v1.0.0</span>
    </div>

    <img 
      src="shared/images/illustration/developer.jpg" 
      onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/briancrink/briancrink.com-shared/refs/heads/main/images/illustration/developer.jpg';" 
      alt="Software Developer" 
      class="dev-image" 
      draggable="false">
  </div>

  <div class="body">
    <a href="https://github.com/briancrink" class="stats-link" target="_blank" rel="noopener">
      <div class="stats" id="stats"></div>
    </a>

    <div class="calendar-wrapper">
      <div class="day-labels">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>

      <div class="graph-area">
        <div class="month-labels" id="month-labels"></div>
        <div id="calendar" class="loading"></div>
      </div>
    </div>

    <div class="legend">
      Less
      <div class="day level-0"></div>
      <div class="day level-1"></div>
      <div class="day level-2"></div>
      <div class="day level-3"></div>
      <div class="day level-4"></div>
      More
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    function formatTooltipDate(dateStr, count, level) {
      const date = new Date(dateStr + 'T00:00:00');
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June',
                      'July', 'August', 'September', 'October', 'November', 'December'];

      const dayName = days[date.getDay()];
      const monthName = months[date.getMonth()];
      const day = date.getDate();
      const year = date.getFullYear();

      const levelColors = {
        0: '#8b949e',
        1: '#0e4429',
        2: '#006d32',
        3: '#26a641',
        4: '#39d353'
      };

      const color = levelColors[level] || '#8b949e';
      const contribText = count === 1 ? 'Contribution' : 'Contributions';

      const numberHtml = count > 0
        ? `<span style="color:${color}; font-weight:600;">${count}</span>`
        : `${count}`;

      return `${dayName} ${monthName} ${day}, ${year}<br>${numberHtml} ${contribText}`;
    }

    function setupTooltip() {
      const tooltip = document.getElementById('tooltip');

      document.querySelectorAll('.day[data-tooltip]').forEach(cell => {
        cell.addEventListener('mouseenter', () => {
          tooltip.innerHTML = cell.getAttribute('data-tooltip');
          tooltip.classList.add('visible');

          const rect = cell.getBoundingClientRect();
          const tipWidth = tooltip.offsetWidth;
          const tipHeight = tooltip.offsetHeight;

          let left = rect.left + rect.width / 2;
          let top = rect.top - 10;

          const minLeft = tipWidth / 2 + 8;
          const maxLeft = window.innerWidth - tipWidth / 2 - 8;
          left = Math.max(minLeft, Math.min(maxLeft, left));

          if (top - tipHeight < 8) {
            top = rect.bottom + 10;
            tooltip.style.transform = 'translate(-50%, 0) scale(1)';
          } else {
            tooltip.style.transform = 'translate(-50%, -100%) scale(1)';
          }

          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${top}px`;
        });

        cell.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
      });
    }

    async function loadContributions() {
      try {
        const res = await fetch('https://github-contributions-api.jogruber.de/v4/briancrink?y=2026');
        const data = await res.json();

        let contributions = data.contributions;
        const total = data.total?.["2026"] ?? contributions.reduce((sum, d) => sum + d.count, 0);

        document.getElementById('stats').innerHTML = 
          `<strong>${total}</strong> Public GitHub Contributions`;

        // Pad start so weeks begin on Sunday
        if (contributions.length > 0) {
          const firstDate = new Date(contributions[0].date + 'T00:00:00');
          const firstDayOfWeek = firstDate.getDay(); // 0 = Sun

          for (let i = 0; i < firstDayOfWeek; i++) {
            contributions.unshift({
              date: null,
              count: 0,
              level: 0,
              empty: true
            });
          }
        }

        const calendar = document.getElementById('calendar');
        const monthLabels = document.getElementById('month-labels');

        calendar.innerHTML = '';
        monthLabels.innerHTML = '';
        calendar.classList.remove('loading');

        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        let lastMonth = -1;
        let lastYear = -1;

        for (let i = 0; i < contributions.length; i += 7) {
          const week = document.createElement('div');
          week.className = 'week';

          const days = contributions.slice(i, i + 7);
          const firstRealDay = days.find(d => d.date);

          const monthLabel = document.createElement('span');

          if (firstRealDay) {
            const date = new Date(firstRealDay.date + 'T00:00:00');
            const month = date.getMonth();
            const year = date.getFullYear();
            const shortYear = String(year).slice(-2);

            if (month !== lastMonth || year !== lastYear) {
              monthLabel.textContent = `${monthNames[month]} '${shortYear}`;
              lastMonth = month;
              lastYear = year;
            } else {
              monthLabel.textContent = '';
            }
          } else {
            monthLabel.textContent = '';
          }

          monthLabels.appendChild(monthLabel);

          days.forEach(day => {
            const cell = document.createElement('div');

            if (day.empty || !day.date) {
              cell.className = 'day empty';
            } else {
              cell.className = `day level-${day.level}`;
              cell.setAttribute('data-tooltip', formatTooltipDate(day.date, day.count, day.level));
              cell.setAttribute('data-date', day.date);

              // Open GitHub profile filtered to this exact day
              cell.addEventListener('click', () => {
                const url = `https://github.com/briancrink?tab=overview&from=${day.date}&to=${day.date}`;
                window.open(url, '_blank', 'noopener,noreferrer');
              });
            }

            week.appendChild(cell);
          });

          while (week.children.length < 7) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day empty';
            week.appendChild(emptyCell);
          }

          calendar.appendChild(week);
        }

        setupTooltip();

      } catch (err) {
        document.getElementById('calendar').textContent = 'Failed to load contributions.';
        console.error(err);
      }
    }

    loadContributions();
  </script>
</body>
</html>
